<body><main>
<h1>복서 · 대기 모션 수정본</h1><p>가로 8프레임 · 160 × 96 / 프레임 · 반복 재생</p>
<div class="stage"><div class="sprite" id="sprite" role="img" aria-label="숨 쉬며 대기하는 복서"></div></div>
<div class="controls"><button id="toggle">일시 정지</button><label>속도 <input id="speed" type="range" min="2" max="24" value="6"> <span id="fps">6</span> FPS</label></div>
<p id="frameLabel">1 / 8</p>
<script>
// 1. 시트 설정: 한 칸 너비와 전체 프레임 수
const frameWidth = 160;
const frameCount = 8;
const sprite = document.querySelector('#sprite');
const speed = document.querySelector('#speed');
let playing = true;
let elapsed = 0;
let previousTime;

// 2. 재생/정지 및 속도 조절
 document.querySelector('#toggle').onclick = event => {
    playing = !playing;
    event.target.textContent = playing ? '일시 정지' : '재생';
};
speed.oninput = () => document.querySelector('#fps').textContent = speed.value;

// 3. 경과 시간으로 프레임을 선택하고, 배경 이미지를 왼쪽으로 이동
function animate(time) {
    if (previousTime !== undefined && playing) elapsed += time - previousTime;
    previousTime = time;
    const frame = Math.floor(elapsed * Number(speed.value) / 1000) % frameCount;
    sprite.style.backgroundPosition = `-${frame * frameWidth}px 0px`;
    document.querySelector('#frameLabel').textContent = `${frame + 1} / ${frameCount}`;
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</main></body></html>
